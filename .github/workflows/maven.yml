# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Celeborn CI

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 
    github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  service:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 8
          os: macos-latest
          arch: x64
          runner: macos-15-intel
          expander_leg: macos-latest-8-x64
    steps:
    - uses: actions/checkout@v4
    - name: Setup JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: ${{ matrix.java }}
        # Zulu publishes no JDK 8 build for Windows on arm64, so setup-java finds nothing for
        # "semver 8" on windows-11-arm. Install the x64 JDK 8 there instead; Windows 11 on ARM
        # runs it under x64 emulation. An empty value lets setup-java use the runner's own arch.
        architecture: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64' && matrix.java == 8) && 'x64' || '' }}
        cache: maven
        check-latest: false
    - name: Test Service with Maven
      run: build/mvn -Pgoogle-mirror test
    - name: Upload test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: service-java-${{ matrix.java }}-unit-test-log
        path: |
          **/target/test-reports/**
          **/target/unit-tests.log

    - name: Upload coverage to Codecov
      if: matrix.java == 8
      # The v3 uploader is a prebuilt native binary that does not match every runner's CPU
      # architecture (on macos-15-intel it fails to spawn with "Bad CPU type", error -86).
      # Coverage upload is reporting only, so a failed upload must not fail the tested build.
      continue-on-error: true
      uses: codecov/codecov-action@v3

    name: service [${{ matrix.expander_leg }}]
    timeout-minutes: 150
